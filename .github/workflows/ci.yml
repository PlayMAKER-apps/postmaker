name: Verify and publish PWA
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist/web
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@v4
  desktop-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run desktop:build -- --no-bundle
      - name: Smoke launch compiled application
        shell: pwsh
        run: |
          $executable = Resolve-Path 'apps/desktop/src-tauri/target/release/postmaker-desktop.exe'
          $process = Start-Process -FilePath $executable -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "PostMAKER exited during smoke launch with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id
  package-windows:
    if: github.event_name == 'workflow_dispatch'
    needs: desktop-verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: postmaker-windows-unsigned
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
